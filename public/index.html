<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1216">
<title>Messagerie privée chiffrée</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
</head>
<body>

<main id="auth-view" class="view">
  <div class="card">
    <h1>Messagerie privée</h1>
    <p class="subtitle">Chiffrement de bout en bout — le serveur ne lit jamais vos messages.</p>

    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">Connexion</button>
      <button id="tab-register" class="tab" type="button">Créer un compte</button>
    </div>

    <form id="login-form" class="form">
      <label for="login-username">Nom d'utilisateur</label>
      <input id="login-username" name="username" autocomplete="username" required>
      <label for="login-password">Mot de passe</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>

    <form id="register-form" class="form hidden">
      <label for="register-username">Nom d'utilisateur</label>
      <input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
      <label for="register-password">Mot de passe (10 caractères min.)</label>
      <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <button type="submit">Créer le compte</button>
    </form>

    <p id="auth-status" class="status" role="status"></p>
  </div>
</main>

<main id="chat-view" class="view hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="me-username"></span>
      <div class="sidebar-actions">
        <button id="new-group-btn" type="button" title="Créer un groupe">+ Groupe</button>
        <button id="logout-btn" type="button" title="Se déconnecter">Déconnexion</button>
      </div>
    </div>

    <form id="new-group-form" class="new-group-form hidden">
      <input id="new-group-name" placeholder="Nom du groupe" autocomplete="off" required>
      <div id="new-group-members" class="new-group-members"></div>
      <button type="submit">Créer</button>
    </form>

    <ul id="contact-list" class="contact-list"></ul>
  </aside>
  <section class="chat">
    <header id="chat-header" class="chat-header">Sélectionnez une conversation</header>
    <ul id="message-list" class="message-list"></ul>
    <form id="send-form" class="send-form hidden">
      <input id="file-input" type="file" class="hidden">
      <button type="button" id="attach-btn" title="Joindre un fichier">📎</button>
      <button type="button" id="voice-btn" title="Message vocal">🎙️</button>
      <input id="message-input" autocomplete="off" placeholder="Votre message (chiffré avant envoi)…">
      <button type="submit">Envoyer</button>
    </form>
  </section>
</main>

<script src="/vendor/libsodium.js"></script>
<script src="/vendor/libsodium-wrappers.js"></script>
<script src="/js/crypto.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
