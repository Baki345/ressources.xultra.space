# IMPORTANT — nom du Worker qui sert réellement xultra.space en prod.
# Découvert le 2026-09-23 après des heures de "wrangler deploy" qui
# n'atteignaient jamais le site live : xultra.space (le domaine nu, sans
# sous-domaine) est rattaché via un CUSTOM DOMAIN Cloudflare (prioritaire
# sur n'importe quelle Route) au Worker nommé "bitter-violet-3f1a" — un nom
# généré automatiquement par Cloudflare à un moment donné, qui ne
# correspondait plus au nom déclaré ici. Un simple `wrangler deploy`
# déployait donc vers un AUTRE Worker (celui nommé ci-dessous), inoffensif
# mais qui ne servait jamais aucun trafic réel — voir aussi la route déclarée
# plus bas, qui elle non plus ne gagne jamais face au Custom Domain pour le
# domaine nu. `name` est donc maintenant aligné sur la réalité : un simple
# `wrangler deploy` (sans --env) déploie enfin vers le bon Worker.
name = "bitter-violet-3f1a"
type = "service"
account_id = "d69428d83fd24b06b7ddc68bf7c48ca1"
workers_dev = true
# Pas de `route` ici : xultra.space est déjà servi via le Custom Domain
# Cloudflare (prioritaire, voir plus haut), et le pattern générique
# "*.xultra.space/*" est de toute façon déjà revendiqué par l'autre Worker
# ("ressources-xultra-space-production", créé par erreur) — le déclarer ici
# ferait juste échouer chaque déploiement sur cette étape pour rien.
main = "worker.js"
compatibility_date = "2026-09-20"

# SITE_KV : binding KV namespace (jamais un secret_text) — invisible via
# `workers/scripts/.../settings` (qui ne liste que les secret_text), donc
# absent du commentaire ci-dessus listant les "vrais secrets" déjà présents
# sur bitter-violet-3f1a. Contrairement aux secrets, un déploiement qui ne
# déclare PAS explicitement un kv_namespace ici le retire du script — ce qui
# s'est produit le 2026-09-23 (les tout premiers `wrangler deploy` de cette
# session utilisaient un wrangler.toml minimal sans cette section) et a cassé
# le mode maintenance, le cache de traduction i18n, la limitation de débit et
# l'inscription par clé d'accès (passkey) le temps que ce soit repéré et
# corrigé ("Stockage indisponible"). Ne plus jamais déployer sans cette
# section — id retrouvé via `wrangler kv:namespace list` (namespace nommé
# "SITE_KV", contenait déjà maint_enabled/maint_message).
[[kv_namespaces]]
binding = "SITE_KV"
id = "f59753be79e44608ae7e3553f11b2f71"

# [env.production] retiré : il pointait vers "ressources-xultra-space-production",
# un Worker distinct créé par erreur (aucun trafic réel ne lui a jamais été
# routé) qui contenait en plus une VRAIE valeur de secret (VPN_MANAGER_SECRET)
# écrite en clair dans ce fichier suivi par git — mauvaise pratique à ne pas
# reproduire. Les vrais secrets (AW_ADMIN_KEY, VPN_MANAGER_SECRET, etc.) sont
# posés directement sur "bitter-violet-3f1a" via `wrangler secret put
# <NOM> --name bitter-violet-3f1a`, jamais dans ce fichier.
